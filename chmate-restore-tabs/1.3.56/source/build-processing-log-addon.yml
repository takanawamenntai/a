name: Build ChMate MEGA log add-on
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-processing-log-addon.yml
      - src/ProcessingLogPatch.java
      - scripts/processing-log-addon.gradle
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: areteruhiro/Haiagaru-Morphe
          ref: 030b7615364d0b1157fab6b0e416f5e8c4ac9e4e
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify input bundles
        run: |
          set -euo pipefail
          mkdir work
          cat validation/processing-log/processing-log-ci-45744508160-1/part-* > work/patched.mpp
          curl -fsSL --retry 3 -o work/official.mpp https://github.com/areteruhiro/Haiagaru-Morphe/releases/download/1.45.0/patches-1.45.0.mpp
          cp releases/1.3.55/4.mpp work/base.mpp
          cd work
          sha256sum -c <<'SUMS'
          3ac44e3d7829215d21f4a6a93197d387342a03e1ffb518b0ac68f6fbf3b01a64  patched.mpp
          3b1367dfac61b9b92ffde8e89570df3a5617f588629402cc963849c909d0a242  official.mpp
          4648744ae549dcf117b4665e756424ee833c97c9bf7874b337277bcb3cbd366f  base.mpp
          SUMS
      - name: Compile the independent add-on
        env:
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          export LOG_CLASSPATH="$GITHUB_WORKSPACE/work/classpath"
          (cd upstream && bash gradlew -I ../scripts/processing-log-addon.gradle :patches:processingLogClasspath --no-daemon)
          classpath="$(cat work/classpath)"
          mkdir -p work/classes work/resources work/dex work/bundle
          javac --release 17 -cp "$classpath" -d work/classes src/ProcessingLogPatch.java
          java -cp "work/classes:$classpath" jp.takanawamenntai.chmate.ProcessingLogPatch work/official.mpp work/patched.mpp work/resources
          unzip -q work/base.mpp -d work/bundle
          jar --create --file work/patch.jar -C work/classes .
          d8="$(find "$ANDROID_HOME/build-tools" -name d8 | sort -V | tail -1)"
          "$d8" --min-api 26 --output work/dex work/patch.jar work/bundle/classes.dex
          test -f work/dex/classes.dex
          test ! -f work/dex/classes2.dex
          cp work/dex/classes.dex work/bundle/classes.dex
          cp -r work/classes/jp work/bundle/
          cp work/resources/*.dex work/bundle/
          cp upstream/LICENSE work/bundle/PROCESSING-LOG-LICENSE
          cp upstream/NOTICE work/bundle/PROCESSING-LOG-NOTICE
          sed -i 's/^Version: 1[.]3[.]55/Version: 1.3.56/' work/bundle/META-INF/MANIFEST.MF
          (cd work/bundle && zip -q -r ../4.mpp .)
          unzip -tq work/4.mpp
          sha256sum work/4.mpp
      - name: Save the add-on for ChMate 191 validation
        run: |
          set -euo pipefail
          directory="validation/processing-log-addon/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$directory"
          cp work/4.mpp "$directory"
          (cd "$directory" && sha256sum 4.mpp > sha256.txt)
          git add "$directory"
          git config user.name github-actions
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage independent MEGA processing log add-on"
          git pull --rebase origin main
          git push origin HEAD:main
