name: Publish verified StreamClock dev64

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-streamclock-dev64.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streamclock-dev64-distribution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify CI-built Morphe/RVX bundles
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 --silent --show-error 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-61d4-8211-a62b-1ea04257d399/raw?se=2026-10-10T13%3A08%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=42a1dbb0-9967-57ed-952c-24a840325aae&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T23%3A24%3A55Z&ske=2026-10-10T23%3A24%3A55Z&sks=b&skv=2026-02-06&sig=gE6lqnY1sjqjSqiZH%2BCLjBrtjeWXduc99RddybRWsmU%3D' -o /tmp/verified-bundles.zip
          echo 'ef42b0b329f4342760319ea54c72076489fdab2ad8d901b0f77a56aee9c7ce69  /tmp/verified-bundles.zip' | sha256sum -c -
          unzip -t /tmp/verified-bundles.zip
          unzip -jo /tmp/verified-bundles.zip 'streamclock-morphe-1.0.0-dev.64.mpp' 'streamclock-rvx-1.0.0-dev.64.mpp' -d /tmp
          mv /tmp/streamclock-morphe-1.0.0-dev.64.mpp 1.mpp
          mv /tmp/streamclock-rvx-1.0.0-dev.64.mpp 2.mpp
          echo 'c2716605cef2b82c7d6640e0f74063694bdcae0093c3fc6c96f5969f706ca3e2  1.mpp' | sha256sum -c -
          echo 'a84a2633b7611fae93e3c2b5ffa137ea2a96a6161c93f25508ea3daf4ca7b3fe  2.mpp' | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          for p in ('1.mpp','2.mpp'):
              with ZipFile(p) as z:
                  assert b'Version: 1.0.0-dev.64' in z.read('META-INF/MANIFEST.MF')
          print('Morphe and RVX manifests verified')
          PY

      - name: Update public GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload x 1.mpp 2.mpp --clobber --repo "$GITHUB_REPOSITORY"
          mkdir -p /tmp/public-copy
          gh release download x --repo "$GITHUB_REPOSITORY" --pattern '1.mpp' --pattern '2.mpp' --dir /tmp/public-copy
          echo 'c2716605cef2b82c7d6640e0f74063694bdcae0093c3fc6c96f5969f706ca3e2  /tmp/public-copy/1.mpp' | sha256sum -c -
          echo 'a84a2633b7611fae93e3c2b5ffa137ea2a96a6161c93f25508ea3daf4ca7b3fe  /tmp/public-copy/2.mpp' | sha256sum -c -

      - name: Update release feeds and repository binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime,timezone
          import json
          date=datetime.now(timezone.utc).replace(tzinfo=None,microsecond=0).isoformat()
          for i in (1,2):
              metadata={
                'created_at':date,
                'description':'StreamClock dev.64 試験版: 実況ボタンで再生位置の日時を即送信。日時が取得できれば自動同期（毎回の確認不要）、停止・シーク・倍速通知。Android実機での検証は継続中。',
                'download_url':f'https://github.com/takanawamenntai/a/releases/download/x/{i}.mpp',
                'signature_download_url':'',
                'page_url':'https://github.com/takanawamenntai/a',
                'version':'1.0.0-dev.64'
              }
              with open(f'{i}.json','w',encoding='utf-8') as o:
                  json.dump(metadata,o,ensure_ascii=False,indent=2)
                  o.write('\n')
          PY
          git config user.name streamclock-publisher
          git config user.email sync@users.noreply.github.com
          git add 1.mpp 2.mpp 1.json 2.json
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'sync: publish dev64 Morphe/RVX automatic replay clock and position bundles'
          git push origin HEAD:main

      - name: Verify feeds and committed binary hashes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:1.mpp | sha256sum | grep c2716605cef2b82c7d6640e0f74063694bdcae0093c3fc6c96f5969f706ca3e2
          git show origin/main:2.mpp | sha256sum | grep a84a2633b7611fae93e3c2b5ffa137ea2a96a6161c93f25508ea3daf4ca7b3fe
          python3 - <<'PY'
          import json
          for i in (1,2):
              obj=json.load(open(f'{i}.json',encoding='utf-8'))
              assert obj['version']=='1.0.0-dev.64'
              assert obj['download_url'].endswith(f'/{i}.mpp')
          print('dev64 public files verified')
          PY
