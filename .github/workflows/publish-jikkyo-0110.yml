name: Publish Android Jikkyo v0.10.10 Direct APK and Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-jikkyo-0110.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and reconstruct stable signed release APK
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/stage/jikkyo-v0.10.10:refs/remotes/origin/stage/jikkyo-v0.10.10
          : > /tmp/replay-0110.b64
          for item in 00 01 02 03; do
            git show "origin/stage/jikkyo-v0.10.10:.github/transfers/jikkyo-v0.10.10/$item.b64" >> /tmp/replay-0110.b64
          done
          base64 --decode /tmp/replay-0110.b64 > /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk
          echo '5b6613e4868330a919a929abba2b3ec84506b41c1ff02f51a036ab78052135b4  /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk' | sha256sum -c -
          unzip -t /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk >/dev/null
          test -s /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk
      - name: Install APK in public raw-download folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk downloads/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk
          cmp /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk downloads/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk
          echo '5b6613e4868330a919a929abba2b3ec84506b41c1ff02f51a036ab78052135b4  downloads/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk' | sha256sum -c -
      - name: Publish independent public Release download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=jikkyo-v0.10.10-media-live
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title '実況リプレイ v0.10.10 - サムネイルとDAT自動補完' \
              --notes '画像の全体表示・サムネ黒帯削除・YouTube動画/ライブ/Shortsリンクプレビュー。Drive保存DATが未反映なら掲示板へ自動フォールバック。固定署名付き上書き更新APK。'
          gh release upload "$tag" /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk --clobber --repo "$GITHUB_REPOSITORY"
          mkdir -p /tmp/jikkyo-verify
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk' --dir /tmp/jikkyo-verify
          cmp /tmp/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk /tmp/jikkyo-verify/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk
          echo '5b6613e4868330a919a929abba2b3ec84506b41c1ff02f51a036ab78052135b4  /tmp/jikkyo-verify/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk' | sha256sum -c -
      - name: Commit raw-download APK and remove temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-jikkyo-0110.yml
          git add downloads/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk
          git config user.name 'jikkyo-public-release-bot'
          git config user.email 'jikkyo-public-release-bot@users.noreply.github.com'
          git commit -m 'download: signed Jikkyo v0.10.10 media and recent DAT fallback'
          git push origin HEAD:main
      - name: Verify remote root APK hash
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:downloads/Android_Jikkyo_v0.10.10_Media_Live_Fallback.apk > /tmp/remote-jikkyo.apk
          echo '5b6613e4868330a919a929abba2b3ec84506b41c1ff02f51a036ab78052135b4  /tmp/remote-jikkyo.apk' | sha256sum -c -
          git push origin --delete stage/jikkyo-v0.10.10
