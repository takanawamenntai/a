name: x
on:
  push:
    paths:
      - ".github/workflows/x.yml"
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view x --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload x 1.mpp 2.mpp --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create x 1.mpp 2.mpp --title x --notes "" --repo "$GITHUB_REPOSITORY"
          fi
