name: Publish StreamClock dev60 to public source
on:
  push:
    paths:
      - '.github/workflows/publish-dev60.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage verified Morphe and RVX build artifacts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-25c8-8209-ab8a-09d03a6178c3/raw?se=2026-10-10T04%3A23%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=9a968c40-22aa-5807-907c-ab07650eefd4&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T00%3A33%3A19Z&ske=2026-10-11T00%3A33%3A19Z&sks=b&skv=2026-02-06&sig=1Rw2xNfuT5lnjxo%2Bd0nTnXhAQoVxPN8lbv33S6c4SaA%3D' --output /tmp/streamclock-dev60.zip
          mkdir -p /tmp/streamclock-stage
          unzip -q /tmp/streamclock-dev60.zip -d /tmp/streamclock-stage
          cp /tmp/streamclock-stage/streamclock-morphe-1.0.0-dev.60.mpp 1.mpp
          cp /tmp/streamclock-stage/streamclock-rvx-1.0.0-dev.60.mpp 2.mpp
          echo '017868c1727c0cbbd261d8f028b963378256d1b6340fcb71aeee28f46f976e56  1.mpp' | sha256sum -c -
          echo '31cc1115636f2ffc46159e74f895588d9d6bb76546d7c9225c5a7a30b7d16d02  2.mpp' | sha256sum -c -
      - name: Publish versioned release binaries first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload x 1.mpp 2.mpp --clobber --repo "$GITHUB_REPOSITORY"
      - name: Commit public source metadata after binaries are ready
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          for n in ('1','2'):
              data={
                'created_at': now,
                'description': '',
                'download_url': f'https://github.com/takanawamenntai/a/releases/download/x/{n}.mpp',
                'signature_download_url': '',
                'page_url': 'https://github.com/takanawamenntai/a',
                'version':'1.0.0-dev.60',
              }
              with open(f'{n}.json','w',encoding='utf-8') as f:
                  json.dump(data,f,ensure_ascii=False,indent=2)
                  f.write('\n')
          PY
          git config user.name streamclock-publisher
          git config user.email sync@users.noreply.github.com
          git add 1.mpp 2.mpp 1.json 2.json
          if ! git diff --cached --quiet; then
            git commit -m 'sync: distribute StreamClock dev.60 Morphe and RVX'
            git push
          fi
