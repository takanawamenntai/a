name: Publish StreamClock watch.25 distribution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-streamclock-watch25.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-streamclock-bundles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the exact release files
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/takanawamenntai/a/7a3ac79fce893c845d3eda984879519f0e9f91ef
          curl -fsSL --retry 3 "$base/1.mpp" -o streamclock-watch25-morphe.mpp
          curl -fsSL --retry 3 "$base/2.mpp" -o streamclock-watch25-rvx.mpp
      - name: Publish the release assets and update the existing feeds
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check <<'CHECKSUMS'
          7d405291bb98095b9408d8a208187f35a0e149c303d167ceae65128d8facbeb2  streamclock-watch25-morphe.mpp
          a229a09f6a5b606e0a03d3d18ec5026a3d42ee0f3d6bf21f1857c91ff0738c20  streamclock-watch25-rvx.mpp
          CHECKSUMS
          gh release upload x --clobber --repo "$GITHUB_REPOSITORY" streamclock-watch25-morphe.mpp streamclock-watch25-rvx.mpp
          gh release download x --repo "$GITHUB_REPOSITORY" --pattern 'streamclock-watch25-*.mpp' --dir verified
          cmp streamclock-watch25-morphe.mpp verified/streamclock-watch25-morphe.mpp
          cmp streamclock-watch25-rvx.mpp verified/streamclock-watch25-rvx.mpp
          git pull --ff-only origin main
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from shutil import copyfile
          timestamp = datetime.now(timezone.utc).replace(tzinfo=None, microsecond=0).isoformat()
          version = '1.0.0-dev.79-watch.25'
          for index, variant in ((1, 'morphe'), (2, 'rvx')):
              path = Path(f'{index}.json')
              data = json.loads(path.read_text())
              assert data['version'] in ('1.0.0-dev.79-watch.24', version), data['version']
              if data['version'] != version:
                  data.update(
                      version=version,
                      created_at=timestamp,
                      description='配信一覧を配信中から開き、タブごとにスクロール位置を保持。再生リストごとの既存設定も引き継ぎ。',
                      download_url=f'https://github.com/takanawamenntai/a/releases/download/x/streamclock-watch25-{variant}.mpp',
                  )
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
              copyfile(f'streamclock-watch25-{variant}.mpp', f'{index}.mpp')
          copyfile('2.json', '2-urv.json')
          PY
          git add 1.json 2.json 2-urv.json 1.mpp 2.mpp
          if ! git diff --cached --quiet; then
            git -c user.name=streamclock-sync -c user.email=sync@users.noreply.github.com commit -m 'sync: publish StreamClock watch.25 for Morphe and RVX'
            git push origin HEAD:main
          fi
