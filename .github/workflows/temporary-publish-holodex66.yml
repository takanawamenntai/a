name: Publish dev66 Holodex Morphe RVX
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-publish-holodex66.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout own public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified compiled binary packages
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-81fc-8209-a376-f08c7f18c632/raw?se=2026-10-12T03%3A01%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=168038a6-0636-529d-8028-e7ed12b39ed4&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-12T01%3A15%3A08Z&ske=2026-10-13T01%3A15%3A08Z&sks=b&skv=2026-02-06&sig=RarwLQLs1lhjLNKv2w0WEbjw82q8vYiwPuZ9hVgRxNc%3D" -o /tmp/patches.zip
          unzip -t /tmp/patches.zip
          unzip -j /tmp/patches.zip 'streamclock-morphe-*.mpp' -d /tmp/
          unzip -j /tmp/patches.zip 'streamclock-rvx-*.mpp' -d /tmp/
          cp /tmp/streamclock-morphe-*.mpp /tmp/1.mpp
          cp /tmp/streamclock-rvx-*.mpp /tmp/2.mpp
          test -s /tmp/1.mpp
          test -s /tmp/2.mpp
      - name: Upload release x assets and verify bytes BEFORE changing feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload x /tmp/1.mpp /tmp/2.mpp --clobber --repo takanawamenntai/a
          mkdir -p /tmp/release_verify
          gh release download x --pattern '1.mpp' --pattern '2.mpp' --dir /tmp/release_verify --repo takanawamenntai/a
          cmp /tmp/1.mpp /tmp/release_verify/1.mpp
          cmp /tmp/2.mpp /tmp/release_verify/2.mpp
      - name: Commit matching public root binaries and feed metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          for name in ('1','2'):
              old=json.load(open(name+'.json',encoding='utf-8'))
              assert old['version'] in ('1.0.0-dev.65','1.0.0-dev.66'), old['version']
              old['version']='1.0.0-dev.66'
              old['created_at']=datetime.now(timezone.utc).replace(tzinfo=None,microsecond=0).isoformat()
              old['description']='StreamClock dev.66: 配信一覧はPiP・背面で非表示、再生操作に合わせて一時表示。サムネイルとタイトルのタップで再生。時計・DVR・実況IPCは維持。実機検証待ち。'
              old['download_url']='https://github.com/takanawamenntai/a/releases/download/x/'+name+'.mpp'
              with open(name+'.json','w',encoding='utf8') as f:
                  json.dump(old,f,ensure_ascii=False,indent=2)
                  f.write('\n')
          PY
          cp /tmp/1.mpp ./1.mpp
          cp /tmp/2.mpp ./2.mpp
          cmp /tmp/1.mpp ./1.mpp
          cmp /tmp/2.mpp ./2.mpp
          git rm .github/workflows/temporary-publish-holodex66.yml
          git add 1.mpp 2.mpp 1.json 2.json
          git config user.name "holodex-release-bot"
          git config user.email "holodex-release-bot@users.noreply.github.com"
          git commit -m "sync: StreamClock dev66 Holodex 配信一覧"
          git push origin HEAD:main
      - name: Check public source versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in 1 2; do
            v="$(gh api repos/takanawamenntai/a/contents/$n.json --jq .content | base64 -d | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            test "$v" = '1.0.0-dev.66'
          done
          echo "Verified dev66 public version metadata and release binary checks"
