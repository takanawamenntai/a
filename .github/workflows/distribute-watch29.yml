name: Distribute StreamClock watch.29
on:
  push:
    branches: [distribution/watch29-live]
    paths: ['.github/workflows/distribute-watch29.yml']
permissions:
  contents: write
jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release bytes and publish the public feed
        run: |
          set -euo pipefail
          sha256sum --check <<'SUMS'
          48927133fe9dfbcf28265acf0f4218db23c23dbe0827a2d9e97b8eb215158897  1.mpp
          1c5f6f81a25359e08474c9eb3a7589e5a7d4cf35dc4a02a2cbd48175b7954f16  2.mpp
          SUMS
          stage="$(mktemp -d)"
          cp 1.mpp 2.mpp "$stage/"
          git fetch origin main
          git switch -c publish-watch29 origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert all(json.loads(Path(name + ".json").read_text())["version"] == "1.0.0-dev.79-watch.27"
                     for name in ("1", "2", "2-urv"))
          PY
          gh release upload x "$stage/1.mpp" "$stage/2.mpp" --clobber --repo "$GITHUB_REPOSITORY"
          gh release download x --repo "$GITHUB_REPOSITORY" --pattern '1.mpp' --pattern '2.mpp' --dir "$stage/readback"
          for asset in 1.mpp 2.mpp; do
            cmp "$stage/$asset" "$stage/readback/$asset"
            cp "$stage/$asset" "$asset"
          done
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          for name, asset in (("1", "1"), ("2", "2"), ("2-urv", "2")):
              path = Path(name + ".json")
              data = json.loads(path.read_text())
              data.update(version="1.0.0-dev.79-watch.29",
                          created_at=datetime.now(timezone.utc).replace(tzinfo=None, microsecond=0).isoformat(),
                          description="実況ボタンを右下の操作列の上に移動。ライブ配信中は時計の下に、現在の再生位置までの配信経過時間を表示。",
                          download_url=f"https://github.com/takanawamenntai/a/releases/download/x/{asset}.mpp",
                          signature_download_url="")
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          git add 1.mpp 2.mpp 1.json 2.json 2-urv.json
          git -c user.name=streamclock-sync -c user.email=sync@users.noreply.github.com commit -m 'Publish StreamClock watch.29 replay button and live elapsed time'
          git push origin HEAD:main
          git fetch origin main
          for name in 1.mpp 2.mpp 1.json 2.json 2-urv.json; do
            git show "origin/main:$name" | cmp "$name" -
          done
