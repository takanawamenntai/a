name: s

on:
  push:

permissions:
  contents: write

jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-3fa0-8209-b469-d1757fc4bb2f/raw?se=2026-09-19T21%3A20%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=1c0bab74-8617-53eb-b703-86826cb5f850&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T19%3A24%3A52Z&ske=2026-09-20T19%3A24%3A52Z&sks=b&skv=2026-02-06&sig=we0Cts6euvn/JXl8aLUBEKx10uaO/2uyVcout9%2BEXeI%3D' -o /tmp/x.zip
          rm -rf /tmp/x
          mkdir -p /tmp/x
          unzip -q /tmp/x.zip -d /tmp/x
          mapfile -t f < <(find /tmp/x -maxdepth 1 -type f -name '*.mpp' | sort)
          test "${#f[@]}" -eq 2
          cp "${f[0]}" 1.mpp
          cp "${f[1]}" 2.mpp
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          v = "1.0.0-dev.55"
          t = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00","Z")
          for n in ("1","2"):
              d = {
                  "created_at": t,
                  "description": "",
                  "download_url": f"https://raw.githubusercontent.com/takanawamenntai/a/main/{n}.mpp",
                  "signature_download_url": "",
                  "version": v
              }
              with open(f"{n}.json","w",encoding="utf-8") as h:
                  json.dump(d,h,ensure_ascii=False,indent=2)
                  h.write("\n")
          PY
          rm -f .github/workflows/s.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name sync
          git config user.email sync@users.noreply.github.com
          git add -A
          git commit -m sync
          git push
