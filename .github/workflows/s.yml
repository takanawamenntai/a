name: s
on:
  push:
    paths:
      - ".github/workflows/s.yml"

permissions:
  contents: write

jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-e5e4-820b-b652-27e5c9346e2a/raw?se=2026-09-20T05%3A24%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=e36f274f-d08c-5dfd-becd-24001ced8b54&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T22%3A31%3A48Z&ske=2026-09-20T22%3A31%3A48Z&sks=b&skv=2026-02-06&sig=6tWyxBMH78dmvWQ9UgCXcVa0SOC0N3M0KAETVA/KFZM%3D' -o /tmp/z.zip
          rm -rf /tmp/z
          mkdir -p /tmp/z
          unzip -q /tmp/z.zip -d /tmp/z

          f1="$(find /tmp/z -type f -name 'streamclock-morphe-*.mpp' -print -quit)"
          f2="$(find /tmp/z -type f -name 'streamclock-rvx-*.mpp' -print -quit)"
          vf="$(find /tmp/z -type f -name 'version.txt' -print -quit)"
          test -n "$f1" && test -n "$f2" && test -n "$vf"

          ver="$(tr -d '\r\n' < "$vf")"
          ver="${ver#v}"

          cp "$f1" 1.mpp
          cp "$f2" 2.mpp

          python3 - "$ver" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          version = sys.argv[1]
          now = datetime.now(timezone.utc).replace(tzinfo=None, microsecond=0).isoformat()
          for n in ("1", "2"):
              data = {
                  "created_at": now,
                  "description": "",
                  "download_url": f"https://github.com/takanawamenntai/a/releases/download/x/{n}.mpp",
                  "signature_download_url": "",
                  "page_url": "https://github.com/takanawamenntai/a",
                  "version": version
              }
              with open(f"{n}.json", "w", encoding="utf-8") as h:
                  json.dump(data, h, ensure_ascii=False, indent=2)
                  h.write("\n")
          PY

          if gh release view x --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload x 1.mpp 2.mpp --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create x 1.mpp 2.mpp --title x --notes "" --repo "$GITHUB_REPOSITORY"
          fi

          rm -f .github/workflows/s.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name sync
          git config user.email sync@users.noreply.github.com
          git add -A
          git commit -m sync
          git push
